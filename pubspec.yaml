name: kage_no_machi
description: An atmospheric isometric Edo post-town diorama builder.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ^3.50.1

dependencies:
  bloc: ^9.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_gpu_shaders: ^0.5.2
  flutter_localizations:
    sdk: flutter
  flutter_scene:
    git:
      url: https://github.com/bdero/flutter_scene.git
      path: packages/flutter_scene
      ref: d04d5cc53bf0b704e378e5bc5acb58b23f2b1c05
  flutter_scene_soloud:
    git:
      url: https://github.com/bdero/flutter_scene.git
      path: packages/flutter_scene_soloud
      ref: d04d5cc53bf0b704e378e5bc5acb58b23f2b1c05
  hooks: ^2.2.0
  intl: ^0.20.2
  material_ui: ^1.1.1
  vector_math: ^2.2.0

dependency_overrides:
  flutter_scene:
    git:
      url: https://github.com/bdero/flutter_scene.git
      path: packages/flutter_scene
      ref: d04d5cc53bf0b704e378e5bc5acb58b23f2b1c05
  scene:
    git:
      url: https://github.com/bdero/flutter_scene.git
      path: packages/scene
      ref: d04d5cc53bf0b704e378e5bc5acb58b23f2b1c05

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/audio/
    - assets/ui/
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
  generate: true
  uses-material-design: true

hooks:
  user_defines:
    flutter_scene:
      lighting_features:
        irradiance_field: false
        rect_area_lights: false
        parallax_reflection: false
        point_shadows: false
    kage_no_machi:
      flutter_scene_lighting_features:
        irradiance_field: false
        rect_area_lights: false
        parallax_reflection: false
        point_shadows: false
